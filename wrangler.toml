# Cloudflare Workers configuration for ReForma (Astro SSR + static assets)
#
# Deployed via Cloudflare Workers Builds (Git integration), which runs:
#   build:  npm run build      → astro build + writes dist/.assetsignore
#   deploy: npx wrangler deploy
#
# `name` must match your Worker's name in the Cloudflare dashboard.

name = "reform"
main = "./dist/_worker.js/index.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# ─── Static assets (built site) ──────────────────────────────────────────────
# Astro outputs the SSR worker into ./dist/_worker.js and static files into
# ./dist. .assetsignore (generated by postbuild) excludes the worker bundle.
[assets]
directory = "./dist"
binding = "ASSETS"

# ─── KV binding: stores all property listings ────────────────────────────────
# Create with:  npm run kv:create   then paste the id below.
[[kv_namespaces]]
binding = "LISTINGS"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

# ─── Secrets (NOT committed) ─────────────────────────────────────────────────
# ADMIN_PASSWORD and SESSION_SECRET are intentionally NOT defined here so they
# never land in the public repo. Set them in the dashboard:
#   Worker → Settings → Variables and Secrets → add as encrypted Secret.
# For local dev, create a .dev.vars file (gitignored) or rely on the safe
# fallbacks in src/lib/runtime.ts (admin password "reforma2024").
